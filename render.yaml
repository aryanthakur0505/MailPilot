services:
  - type: web
    name: mailpilot-web
    env: node
    buildCommand: npm ci && npx prisma@6.19.3 db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  # Declared as "web", not Render's native "worker" type — that native type
  # has no free tier regardless of whether the process opens a port, which
  # defeats the dummy HTTP server in worker/email-worker.ts (see its own
  # comment) that exists specifically to pass as a free-tier web service.
  - type: web
    name: mailpilot-worker
    env: node
    buildCommand: npm install && npm run build:worker
    startCommand: npm run worker:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
